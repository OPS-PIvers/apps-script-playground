<!--
  PARTIAL: card-grid
  Purpose: A row of tool/feature cards, each with a red tag eyebrow, heading, and blurb.
  Theme: light
  Uses: .s.light, .head-block, .kicker, .title, .grid3 (or .grid4), .toolcard, .tag, .cascade
  Modes: manual | autobuild | kiosk
  Intensity: calm | standard | lively
  Configurable: kicker, title, each card (tag + heading + body). Swap .grid3↔.grid4 for 3 or 4 cards.
  Notes: Cards have a blue left rule and reveal one-by-one via .cascade. .grid3 / .grid4 give equal
         cards (min-height 380px); for a 3+2 hero layout use .grid5 (see slides.css §10).
-->
<section data-label="Cards" class="s light">
  <div class="head-block">
    <p class="kicker anim">Kicker</p>
    <h2 class="title anim">A row of related things</h2>
  </div>
  <div class="grid3 cascade" style="--cascade-start:3s; --cascade-step:4s">
    <div class="toolcard"><div class="tag">Tag</div><h3>First card</h3><p>One or two sentences describing this item.</p></div>
    <div class="toolcard"><div class="tag">Tag</div><h3>Second card</h3><p>One or two sentences describing this item.</p></div>
    <div class="toolcard"><div class="tag">Tag</div><h3>Third card</h3><p>One or two sentences describing this item.</p></div>
  </div>
</section>
