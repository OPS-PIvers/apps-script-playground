<!--
  PARTIAL: prompt-panel
  Purpose: "Here's the exact prompt" — a reusable panel showing a natural-language prompt verbatim.
  Theme: light (default) — works on navy too.
  Uses: .s.light, .head-block, .kicker, .title, .promptpanel (NEW §9), .pp-kicker, .pp-text (+ <b> for
        the load-bearing phrase), .pp-meta, .anim/.anim2
  Modes: manual | autobuild | kiosk
  Intensity: calm | standard | lively
  Configurable: kicker, title, the prompt text (bold the phrase that did the work), optional meta line.
  Notes: This generalizes the reference deck's before/after .ba-prompt ("the entire prompt") into a
         standalone panel — use it anywhere you want to show the exact ask, not just between two screenshots.
         Bold (<b>) renders the literal/load-bearing bit in red mono, matching the .ba-prompt treatment.
-->
<section data-label="The prompt" class="s light">
  <div class="head-block">
    <p class="kicker anim">The exact ask</p>
    <h2 class="title anim">Here's the whole prompt</h2>
  </div>
  <div class="promptpanel anim2">
    <p class="pp-kicker">The entire prompt</p>
    <p class="pp-text">&ldquo;Write a Google Apps Script web app bound to this sheet. All columns should be
      configurable from the web app. Use the attached <b>DESIGN.md</b> so it's brand-aligned — and don't
      touch the logic.&rdquo;</p>
    <p class="pp-meta">Pasted verbatim — no editing, no follow-ups.</p>
  </div>
</section>
