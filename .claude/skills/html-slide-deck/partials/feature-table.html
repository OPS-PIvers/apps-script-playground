<!--
  PARTIAL: feature-table
  Purpose: Term/definition rows separated by hairlines — a glossary or "what to know before you ship".
  Theme: light
  Uses: .s.light, .head-block, .kicker, .title, .ftable, .frow (.ft-term + .ft-def), .cascade
  Modes: manual | autobuild | kiosk
  Intensity: calm | standard | lively
  Configurable: kicker, title, each row (term + definition).
  Notes: This is a single-definition list (term → explanation). For a multi-column COMPARE table (rows
         scored across several options) use feature-matrix.html. The term column is a fixed 440px; rows
         reveal via .cascade and the table is vertically centered.
-->
<section data-label="Before you ship" class="s light">
  <div class="head-block">
    <p class="kicker anim">Kicker</p>
    <h2 class="title anim">What to know</h2>
  </div>
  <div class="ftable cascade" style="--cascade-start:3s; --cascade-step:5s">
    <div class="frow"><div class="ft-term">First term</div><div class="ft-def">A clear one- or two-sentence definition.</div></div>
    <div class="frow"><div class="ft-term">Second term</div><div class="ft-def">A clear one- or two-sentence definition.</div></div>
    <div class="frow"><div class="ft-term">Third term</div><div class="ft-def">A clear one- or two-sentence definition.</div></div>
    <div class="frow"><div class="ft-term">Fourth term</div><div class="ft-def">A clear one- or two-sentence definition.</div></div>
  </div>
</section>
