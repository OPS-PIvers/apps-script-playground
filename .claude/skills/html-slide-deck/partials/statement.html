<!--
  PARTIAL: statement
  Purpose: A single big idea, vertically centered — the rhetorical beat between sections.
  Theme: navy
  Uses: .s.navy.statement, .kicker, .big (+ .hl for a red phrase), .sub2, .anim/.anim2/.anim3
  Modes: manual | autobuild | kiosk
  Intensity: calm | standard | lively
  Configurable: kicker, the big line (wrap a phrase in <span class="hl"> to redden it), sub2 paragraph.
  Notes: .big defaults to 132px; override inline (style="font-size:92px") for a longer line.
         .sub2 honors line breaks (white-space: pre-line) — blank lines become paragraph gaps.
-->
<section data-label="Statement" class="s navy statement">
  <p class="kicker anim">The point</p>
  <p class="big anim2">Say the one thing <span class="hl">that matters</span> here.</p>
  <p class="sub2 anim3">A short paragraph that earns the line above it — the reason it's true, in plain language.</p>
</section>
